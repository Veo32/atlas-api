services:
  - type: web
    name: atlas-api
    env: node
    plan: free
    buildCommand: corepack prepare pnpm@11.7.0 --activate && corepack pnpm install --frozen-lockfile && corepack pnpm --filter @aitools/api prisma:generate && corepack pnpm --filter @aitools/shared build && corepack pnpm --filter @aitools/api build
    startCommand: corepack pnpm --filter @aitools/api start
    healthCheckPath: /v1/billing/plans
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://bakrr.net
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
